name: Deploy Laravel

on:
  push:
    branches:
      - main

concurrency:
  group: project-management-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Start deployment log
        run: |
          mkdir -p /var/log/project-management
          echo "Deployment started at $(date -Is)" | tee -a /var/log/project-management/deploy.log
          echo "Commit: $GITHUB_SHA" | tee -a /var/log/project-management/deploy.log

      - name: Enable maintenance mode
        run: |
          cd /var/www/project-management-app
          php artisan down

      - name: Record previous commit
        run: |
          cd /var/www/project-management-app
          git rev-parse HEAD > /var/lib/project-management/previous-commit.txt
          echo "Previous commit: $(cat /var/lib/project-management/previous-commit.txt)"
          
      - name: Pull latest code
        run: |
          cd /var/www/project-management-app
          git pull origin main

      - name: Install PHP dependencies
        run: |
          cd /var/www/project-management-app
          composer install --no-dev --optimize-autoloader

      - name: Install frontend dependencies
        run: |
          cd /var/www/project-management-app
          npm ci

      - name: Build frontend
        run: |
          cd /var/www/project-management-app
          npm run build

      - name: Backup database
        run: |
          sudo /usr/local/bin/backup-project-management.sh

      - name: Run migrations
        run: |
          cd /var/www/project-management-app
          php artisan migrate --force

      - name: Optimize Laravel
        run: |
          cd /var/www/project-management-app
          php artisan optimize

      - name: Restart queue workers
        run: |
          cd /var/www/project-management-app
          php artisan queue:restart

      - name: Disable maintenance mode
        if: always()
        run: |
          cd /var/www/project-management-app
          php artisan up

      - name: Record deployment result
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "Deployment succeeded at $(date -Is)" | tee -a /var/log/project-management/deploy.log
          else
            echo "Deployment failed at $(date -Is)" | tee -a /var/log/project-management/deploy.log
          fi